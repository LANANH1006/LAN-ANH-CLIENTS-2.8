name: Package LAN ANH CLIENT

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip mod jar
        run: |
          unzip -o LanAnhClient-2.8.zip -d out
          ls -la out

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: lananh-client-2.8
          path: out/*.jar
          if-no-files-found: error
